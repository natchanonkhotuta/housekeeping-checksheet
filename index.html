<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังสินค้า · Stock Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* ===================== ดีไซน์ระบบ ===================== */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#fafbfc; --border:#e3e7ec; --border-strong:#cfd6de;
  --text:#12151a; --muted:#6b7482; --faint:#98a1ae;
  --accent:#0f766e; --accent-hover:#115e56; --accent-soft:#e6f4f1; --accent-text:#0f766e;
  --low:#b45309; --low-soft:#fdf3e3; --over:#6d28d9; --over-soft:#f2ecfd;
  --ok:#0f766e; --ok-soft:#e6f4f1; --danger:#b91c1c; --danger-soft:#fdecec;
  --in:#0369a1; --in-soft:#e6f2f9;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05);
  --radius:12px; --radius-sm:8px;
  --sidebar-w:238px;
}
[data-theme="dark"]{
  --bg:#0c0f14; --surface:#141920; --surface-2:#191f27; --border:#232b35; --border-strong:#323c48;
  --text:#e7ebf0; --muted:#98a2b1; --faint:#6c7685;
  --accent:#2dd4bf; --accent-hover:#5eead4; --accent-soft:#0e2b28; --accent-text:#5eead4;
  --low:#fbbf24; --low-soft:#2e2410; --over:#c4b5fd; --over-soft:#241f35; --ok:#2dd4bf; --ok-soft:#0e2b28;
  --danger:#f87171; --danger-soft:#31191a; --in:#7dd3fc; --in-soft:#10242f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
/* ขนาดเริ่มต้นของไอคอน — กันกรณีวางไอคอนในที่ที่ยังไม่ได้กำหนดขนาด แล้วมันขยายเต็มจอ */
svg{width:16px;height:16px;flex:none}

/* ---------- โครงหน้า ---------- */
.app{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px}
.brand .mark{
  width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;
}
[data-theme="dark"] .brand .mark{color:#06201d}
.brand b{font-size:15px; display:block; line-height:1.2}
.brand small{color:var(--faint); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase}
.nav{padding:6px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1}
.nav-label{font-size:11px; color:var(--faint); padding:14px 10px 6px; letter-spacing:.06em; text-transform:uppercase; font-weight:600}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
  text-decoration:none; color:var(--muted); font-weight:500; font-size:14px; transition:.12s;
}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2); color:var(--text)}
.nav a.on{background:var(--accent-soft); color:var(--accent-text); font-weight:600}
.nav a .tag{margin-left:auto; background:var(--low); color:#fff; font-size:10.5px; padding:1px 6px; border-radius:20px; font-weight:600}
[data-theme="dark"] .nav a .tag{color:#241a04}
.nav a .tag.red{background:#dc2626; color:#fff; animation:pulse 2s ease-in-out infinite}
[data-theme="dark"] .nav a .tag.red{background:#ef4444; color:#2a0b0b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
tr.isnew td{background:color-mix(in srgb, var(--danger) 9%, transparent)}
.pill.new{background:var(--danger);color:#fff}
[data-theme="dark"] .pill.new{color:#2a0b0b}
.side-foot{border-top:1px solid var(--border); padding:10px}
.userchip{display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--radius-sm); width:100%; background:none; border:0; cursor:pointer; text-align:left}
.userchip:hover{background:var(--surface-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.userchip .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .rl{font-size:11.5px;color:var(--faint)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:12px 22px; min-height:60px;
}
.topbar h1{font-size:17px}
.topbar .sub{font-size:12.5px;color:var(--faint); margin-top:1px}
.crumb{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{opacity:.6}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--accent-soft);
  border-bottom:1px solid var(--border);font-size:12.5px;color:var(--accent-text)}
.filterbar svg{width:15px;height:15px;flex:none}
.filterbar b{font-weight:600}
.filterbar .x{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:20px;padding:2px 9px;cursor:pointer;font-size:12px}
.filterbar .x:hover{background:rgba(0,0,0,.16)}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text); border-color:var(--border-strong)}
.iconbtn svg{width:16px;height:16px}
.burger{display:none}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.content{padding:22px; max-width:1420px; width:100%}
.demo-bar{display:flex;align-items:center;gap:9px;padding:9px 22px;background:var(--low-soft);color:var(--low);
  border-bottom:1px solid var(--border);font-size:13px}
.demo-bar svg{width:16px;height:16px;flex:none}
.demo-bar .spacer{flex:1}

/* ---------- ส่วนประกอบ ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0}
.card + .card{margin-top:16px}
/* min-width:0 จำเป็นกับลูกของ grid/flex ไม่งั้นตารางกว้าง ๆ จะดันหน้าจอล้นในมือถือ */
.grid > *,.kpis > *,.card-head > *{min-width:0}
.card-head{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap}
.card-head h3{font-size:14.5px}
.card-head .hint{font-size:12.5px; color:var(--faint)}
.card-body{padding:16px}
.grid{display:grid; gap:16px}
.grid.g-dash{grid-template-columns:1.4fr 1fr}
.grid.g-two{grid-template-columns:1fr 1fr}
.grid.g-form{grid-template-columns:1.25fr .85fr}
@media (max-width:1150px){.grid.g-dash,.grid.g-two,.grid.g-form{grid-template-columns:1fr}}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow)}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lbl svg{width:15px;height:15px}
.kpi .num{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:7px;line-height:1.1}
.kpi .sfx{font-size:12.5px;color:var(--faint);font-weight:400;margin-left:3px}
.kpi.warn .num{color:var(--low)} .kpi.warn .lbl svg{color:var(--low)}
.kpi.over .num{color:var(--over)} .kpi.over .lbl svg{color:var(--over)}
.kpi.danger .num{color:var(--danger)} .kpi.danger .lbl svg{color:var(--danger)}
.catbar{height:4px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden;max-width:220px}
.catbar span{display:block;height:100%;background:var(--accent);border-radius:3px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#06201d}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field label .req{color:var(--danger)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);outline:none;transition:.12s;
  min-width:0;  /* ให้ย่อตัวได้ ไม่งั้นช่องกรอกจะดันหน้าจอล้นบนมือถือ */
}
input[type=date]{min-width:128px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:66px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.help{font-size:12px;color:var(--faint)}

.searchbar{position:relative;flex:1 1 150px;max-width:380px;min-width:0}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.searchbar input{padding-left:34px}

.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{
  text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);white-space:nowrap;
}
table.data td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.r,table.data th.r{text-align:right}
.code{font-weight:600;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.low{background:var(--low-soft);color:var(--low)}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.in{background:var(--in-soft);color:var(--in)}
.pill.out{background:var(--low-soft);color:var(--low)}
.pill.adjust{background:var(--over-soft);color:var(--over)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.empty{padding:44px 20px;text-align:center;color:var(--faint)}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px}
.skel{height:13px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:5px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- toast / modal ---------- */
.toast-host{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:11px 14px;box-shadow:var(--shadow);
  display:flex;gap:9px;align-items:flex-start;animation:slide .18s ease-out;font-size:13.5px;
}
.toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--low)}
.toast svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.toast.err svg{color:var(--danger)} .toast.warn svg{color:var(--low)}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(9,12,17,.5);backdrop-filter:blur(2px);z-index:90;display:grid;place-items:center;padding:18px;animation:fade .14s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--border)}
.modal-head{padding:16px 18px 0;display:flex;align-items:center;gap:10px}
.modal-head h3{font-size:16px}
.modal-body{padding:16px 18px}
.modal-foot{padding:0 18px 18px;display:flex;gap:9px;justify-content:flex-end}

/* ---------- หน้า login / setup ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-art{
  background:linear-gradient(160deg,var(--accent) 0%,#134e4a 60%,#0b2b29 100%);
  color:#fff;padding:46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.auth-art:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.16) 1px,transparent 0);background-size:22px 22px;opacity:.5}
.auth-art .z{position:relative;z-index:1}
.auth-art h2{font-size:30px;line-height:1.25;letter-spacing:-.02em;max-width:12ch}
.auth-art p{opacity:.82;margin-top:14px;max-width:34ch;font-size:14.5px}
.auth-art ul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:11px}
.auth-art li{display:flex;gap:10px;align-items:center;font-size:14px;opacity:.92}
.auth-art li svg{width:17px;height:17px;flex:none}
.auth-form{display:grid;place-items:center;padding:34px 22px;background:var(--bg)}
.auth-card{width:min(400px,100%)}
.auth-card .t{font-size:22px;font-weight:600;letter-spacing:-.02em}
.auth-card .d{color:var(--muted);margin:6px 0 22px;font-size:13.5px}
.auth-card .field{margin-bottom:13px}
.auth-alt{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}
.auth-alt button{background:none;border:0;color:var(--accent-text);font-weight:600;cursor:pointer;padding:2px}
.alert{padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;border:1px solid}
.alert.err{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.alert.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.alert.warn{background:var(--low-soft);border-color:transparent;color:var(--low)}

/* ---------- ตะกร้าเบิก / รายการย่อย ---------- */
.basket{display:flex;flex-direction:column;gap:8px}
.basket-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)}
.basket-row .g{flex:1;min-width:0}
.basket-row .g b{font-size:13.5px} .basket-row .g div{font-size:12px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{padding:6px 13px;border:0;background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted)}
.seg button + button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .field{min-width:135px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.dz{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:.14s;background:var(--surface-2)}
.dz:hover,.dz.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz svg{width:30px;height:30px;color:var(--faint);margin-bottom:8px}
.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.stat-line:last-child{border-bottom:0}
.stat-line span:last-child{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- popup รุ่นใหม่ ---------- */
.modal{animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:0}
.modal-head .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.modal-head .ic svg{width:17px;height:17px}
.modal-head .ic.warn{background:var(--low-soft);color:var(--low)}
.modal-head .ic.danger{background:var(--danger-soft);color:var(--danger)}
.modal-sub{font-size:12.5px;color:var(--faint);font-weight:400;margin-top:2px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.detail-grid div{background:var(--surface);padding:10px 12px}
.detail-grid dt{font-size:11.5px;color:var(--faint);margin:0 0 3px}
.detail-grid dd{margin:0;font-weight:600;font-size:14px}
.bignum{display:flex;align-items:baseline;gap:8px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.bignum b{font-size:30px;letter-spacing:-.02em;line-height:1}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);padding:5px 11px;border:1px solid var(--border);border-radius:20px}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.step .n{width:17px;height:17px;border-radius:50%;background:var(--border);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700}
.step.on .n{background:var(--accent);color:#fff}
[data-theme="dark"] .step.on .n{color:#06201d}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.map-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)}
.map-row label{font-size:12.5px;flex:none;width:105px;color:var(--muted)}
.map-row select{padding:6px 8px;font-size:13px}
.map-row.req label{color:var(--text);font-weight:600}
.sheet-note{font-size:12.5px;color:var(--faint);background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border:1px solid var(--border-strong);border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
[data-theme="dark"] .chip.on{color:#06201d}
table.data tbody tr.clickable{cursor:pointer}
/* ---------- รูปสินค้า ---------- */
.thumb{width:38px;height:38px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--border);display:block;padding:2px}
.thumb.ph{display:grid;place-items:center;color:var(--faint)}
.thumb.ph svg{width:17px;height:17px}
.imgbox{width:156px;height:156px;border-radius:10px;border:1px dashed var(--border-strong);display:grid;place-items:center;
  overflow:hidden;background:var(--surface-2);cursor:pointer;flex:none;position:relative;color:var(--faint);text-align:center;font-size:12.5px}
.imgbox:hover{border-color:var(--accent);color:var(--accent-text)}
.imgbox img{width:100%;height:100%;object-fit:contain;background:#fff}
.imgbox svg{width:26px;height:26px;margin-bottom:6px}
.imgwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.danger-zone{border:1px solid var(--danger);border-radius:var(--radius);background:var(--danger-soft)}
.danger-zone .card-head{border-bottom-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.danger-zone h3{color:var(--danger)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;white-space:pre;overflow-x:auto;color:var(--text)}
#printArea .doc img, .docpreview .doc img{width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid #999;display:block;margin:0 auto}
@media print{ #printArea img{-webkit-print-color-adjust:exact;print-color-adjust:exact} }

/* ---------- เอกสารสำหรับพิมพ์ (ใช้สไตล์ชุดเดียวกันทั้งตอนดูตัวอย่างและตอนพิมพ์) ---------- */
#printArea{display:none}
.docpreview{max-height:62vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;background:#fff}
#printArea, .docpreview{color:#000; font-size:11.5px}
#printArea .doc-head, .docpreview .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:7px;margin-bottom:4px}
#printArea .doc-head .co, .docpreview .doc-head .co{font-size:16px;font-weight:700}
#printArea .doc-head .meta, .docpreview .doc-head .meta{text-align:right;font-size:10.5px;line-height:1.6}
#printArea .doc-title, .docpreview .doc-title{text-align:center;font-size:14px;font-weight:700;margin:9px 0 3px}
#printArea .doc-cond, .docpreview .doc-cond{text-align:center;font-size:10.5px;margin-bottom:9px}
#printArea table.doc, .docpreview table.doc{width:100%;border-collapse:collapse;font-size:10.5px}
#printArea table.doc th, #printArea table.doc td,
.docpreview table.doc th, .docpreview table.doc td{border:1px solid #000;padding:4px 5px;color:#000}
#printArea table.doc th, .docpreview table.doc th{background:#eee;font-weight:700;text-align:center}
#printArea table.doc td.c, .docpreview table.doc td.c{text-align:center}
#printArea table.doc td.r, .docpreview table.doc td.r{text-align:right}
#printArea .fill, .docpreview .fill{height:20px}
#printArea .signs, .docpreview .signs{display:flex;gap:26px;margin-top:26px}
#printArea .sign, .docpreview .sign{flex:1;text-align:center;font-size:10.5px}
#printArea .sign .line, .docpreview .sign .line{border-bottom:1px dotted #000;height:34px;margin-bottom:5px}
#printArea .sign .nm, .docpreview .sign .nm{margin-top:3px}
#printArea .doc-foot, .docpreview .doc-foot{margin-top:12px;font-size:9.5px;color:#444;text-align:center}
@media print{
  @page{size:A4 portrait;margin:11mm 10mm}
  html,body{background:#fff !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important}
  #printArea table.doc thead{display:table-header-group}
  #printArea table.doc tr{page-break-inside:avoid}
  #printArea .signs{page-break-inside:avoid}
  .page-break{page-break-before:always}
}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .burger{display:grid}
  .content{padding:16px}
  .topbar{padding:11px 14px}
  .auth-wrap{grid-template-columns:1fr}
  .auth-art{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}

/** แปลงเป็นตัวเลขแบบทนทาน: "1,250" / "12 ชิ้น" -> 1250 / 12 */
function toNum(v) {

  if (v == null) return 0;
  const m = String(v).replace(/[,\s ]/g, '').match(/-?\d+(\.\d+)?/);

/** ย่อรูปก่อนอัปโหลด: ด้านยาวสุดไม่เกิน 900px แปลงเป็น JPEG — ไฟล์เล็ก อัปโหลดเร็ว และพิมพ์ได้คมพอ */
function shrinkImage(file, maxSide, quality) {
  maxSide = maxSide || 900; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);     // กันพื้นโปร่งใสกลายเป็นดำตอนแปลงเป็น JPEG
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('ย่อรูปไม่สำเร็จ')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไฟล์รูปไม่ถูกต้อง')); };
    img.src = url;
  });
}

        '<div class="modal-body">' + body + '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn" data-close>' + esc(cancelText || 'ยกเลิก') + '</button>' +
          (okText ? '<button class="btn ' + (okClass || 'primary') + '" data-ok>' + esc(okText) + '</button>' : '') +
        '</div>' +
      '</div>';
    const close = v => { back.remove(); resolve(v); };
    back.addEventListener('click', async e => {
      if (e.target === back || e.target.closest('[data-close]')) return close(null);
      if (e.target.closest('[data-ok]')) {
        const btn = e.target.closest('[data-ok]'); btn.disabled = true;
        try { const r = onOk ? await onOk(back) : true; if (r !== false) close(r); } finally { btn.disabled = false; }
      }
    });
    document.body.appendChild(back);
    const f = back.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 40);
  });
}
const confirmBox = (title, text, okText, kind) =>
  modal({ title, icon: 'warn', iconClass: kind || 'danger',
    body: '<p style="margin:0;color:var(--muted)">' + esc(text) + '</p>',
    okText: okText || 'ยืนยัน', okClass: kind === 'warn' ? 'primary' : 'danger', onOk: () => true });

/* ====================================================================
   ตัวเชื่อมข้อมูล — มี 2 แบบที่ใช้ API ชุดเดียวกัน
   1) Supabase (ใช้งานจริง)   2) Demo (ข้อมูลจำลองในหน่วยความจำ)
   ==================================================================== */
function makeSupabaseDB(cfg) {
  // ค่าเริ่มต้น: เก็บ session ไว้แค่ใน sessionStorage ปิดเบราว์เซอร์แล้วต้องล็อกอินใหม่
  // ถ้าตั้ง rememberLogin = true จึงจะจำไว้ข้ามการปิดเบราว์เซอร์ (เก็บใน localStorage)
  let store = null;
  try { store = REMEMBER_LOGIN ? window.localStorage : window.sessionStorage; } catch (e) { store = undefined; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: store || undefined }
  });
  const un = (r) => { if (r.error) throw r.error; return r.data; };
  return {
    kind: 'supabase', client: sb,
    async signIn(username, pw) { return un(await sb.auth.signInWithPassword({ email: toEmail(username), password: pw })); },
    async needsSetup() { const r = await sb.rpc('needs_setup'); return r.error ? false : !!r.data; },
    /** สร้างบัญชีใหม่โดยไม่แตะ session ของแอดมินที่กำลังใช้งานอยู่ (ใช้ client ชั่วคราวแยกอีกตัว) */
    async _signUpDetached(p) {
      const tmp = window.supabase.createClient(cfg.url, cfg.anonKey,
        { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const r = await tmp.auth.signUp({
        email: toEmail(p.username), password: p.password,
        options: { data: { username: String(p.username).toLowerCase(), full_name: p.full_name, position: p.position || '' } }
      });
      if (r.error) throw r.error;
      const user = r.data && r.data.user;
      if (!user || !user.id) throw new Error('สร้างบัญชีไม่สำเร็จ');
      if (user.identities && user.identities.length === 0) throw new Error('มีชื่อผู้ใช้นี้อยู่แล้ว');
      try { await tmp.auth.signOut(); } catch (e) { /* ไม่มี session ก็ไม่เป็นไร */ }
      return { id: user.id, needsConfirm: !r.data.session };
    },
    async signOut()          { await sb.auth.signOut(); },
    async changePassword(pw) { return un(await sb.auth.updateUser({ password: pw })); },
    /** ตรวจว่ามี Edge Function admin-users ติดตั้งไว้ไหม (ถ้ามีจะลบบัญชี/รีเซ็ตรหัสผ่านให้คนอื่นได้) */
    async probeAdminFn() {
      if (S.adminFn !== undefined) return S.adminFn;
      try { const r = await sb.functions.invoke('admin-users', { body: { action: 'ping' } }); S.adminFn = !r.error; }
      catch (e) { S.adminFn = false; }
      return S.adminFn;
    },
    async adminFn(body) {
      const r = await sb.functions.invoke('admin-users', { body });
      if (r.error) {
        let msg = r.error.message || 'เรียก Edge Function ไม่สำเร็จ';
        try { const j = await r.error.context.json(); if (j && j.message) msg = j.message; } catch (e) {}
        throw new Error(msg);
      }
      return r.data;
    },
    async createUser(p) {
      if (await this.probeAdminFn()) {
        return await this.adminFn({ action: 'create', username: String(p.username).toLowerCase(), password: p.password,
                                    full_name: p.full_name, position: p.position || '', role: p.role || 'staff' });
      }
      const made = await this._signUpDetached(p);
      // trigger ฝั่งฐานข้อมูลจะสร้างโปรไฟล์ให้ รอสักครู่แล้วค่อยตั้งสิทธิ์
      for (let i = 0; i < 12; i++) {
        const g = await sb.from('profiles').select('id').eq('id', made.id).maybeSingle();
        if (g.data) break;
        await sleep(250);
      }
      const up = await sb.from('profiles').update({
        username: String(p.username).toLowerCase(), full_name: p.full_name,
        position: p.position || '', role: p.role || 'staff', status: 'active'
      }).eq('id', made.id).select().maybeSingle();
      if (up.error) throw up.error;
      return { id: made.id, needsConfirm: made.needsConfirm };
    },
    async updateUser(id, patch) { return un(await sb.from('profiles').update(patch).eq('id', id).select().single()); },
    async deleteUser(id) {
      if (await this.probeAdminFn()) return await this.adminFn({ action: 'delete', id });
      return un(await sb.from('profiles').delete().eq('id', id));   // ลบได้เฉพาะโปรไฟล์ ชื่อผู้ใช้จะยังถูกจองไว้
    },
    async resetUserPassword(id, password) {
      if (!(await this.probeAdminFn())) throw new Error('ต้องติดตั้ง Edge Function admin-users ก่อน จึงจะตั้งรหัสผ่านให้คนอื่นได้');
      return await this.adminFn({ action: 'reset_password', id, password });
    },
    async session()          { return (await sb.auth.getSession()).data.session; },
    onAuth(cb)               { sb.auth.onAuthStateChange((_e, s) => cb(s)); },
    async me()               { return un(await sb.rpc('me')); },
    async updateMyProfile(p) { return un(await sb.rpc('update_my_profile', { p })); },

    async products()         { return un(await sb.from('products').select('*').order('code')) || []; },
    async saveProduct(p) {
      const row = { code: p.code, name: p.name, category: p.category, zone: p.zone, shelf: p.shelf, bin: p.bin,
                    unit: p.unit, reorder_point: toNum(p.reorder_point), owner: p.owner,
                    max_stock: p.max_stock === '' || p.max_stock == null ? null : toNum(p.max_stock) };
      if (p.image_url !== undefined) row.image_url = p.image_url;
      if (p.id) return un(await sb.from('products').update(row).eq('id', p.id).select().single());
      return un(await sb.from('products').insert({ ...row, qty: toNum(p.qty) }).select().single());
    },
    async deleteProduct(id)  { return un(await sb.from('products').delete().eq('id', id)); },

    async stockIn(p)         { return un(await sb.rpc('stock_in', { p })); },
    async stockOut(p)        { return un(await sb.rpc('stock_out', { p })); },
    async stockOutBulk(p)    { return un(await sb.rpc('stock_out_bulk', { p })); },
    async stockAdjust(p)     { return un(await sb.rpc('stock_adjust', { p })); },
    async importRows(p)      { return un(await sb.rpc('import_products', { p })); },
    async stats()            { return un(await sb.rpc('dashboard_stats')) || {}; },

    async transactions(f) {
      f = f || {};
      let q = sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(f.limit || 500);
      if (f.type) q = q.eq('type', f.type);
      if (f.actor) q = q.eq('actor_id', f.actor);
      if (f.from) q = q.gte('created_at', f.from + 'T00:00:00+07:00');
      if (f.to)   q = q.lte('created_at', f.to + 'T23:59:59+07:00');
      if (f.q)    q = q.or('code.ilike.%' + f.q + '%,name.ilike.%' + f.q + '%,counterparty.ilike.%' + f.q + '%');
      return un(await q) || [];
    },
    async users()            { return un(await sb.from('profiles').select('*').order('created_at')) || []; },
    async markHistorySeen()  { return un(await sb.rpc('mark_history_seen')); },
    async settings()         { return un(await sb.from('app_settings').select('*').eq('id', 1).maybeSingle()) || {}; },
    async saveSettings(p)    { return un(await sb.from('app_settings').update(p).eq('id', 1).select().single()); },
    async nextCode(prefix)   { return un(await sb.rpc('next_product_code', { p: prefix == null ? {} : { prefix } })); },
    async uploadImage(blob, code) {
      const path = 'p/' + (code ? String(code).replace(/[^A-Za-z0-9_-]/g, '_') + '-' : '') + Date.now() + '.jpg';
      const up = await sb.storage.from('product-images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
    },
    async setImage(code, url) { return un(await sb.rpc('set_product_image', { p: { code, image_url: url } })); },
    async resetData(p)        { return un(await sb.rpc('reset_data', { p })); },
    subscribe(cb) {
      const ch = sb.channel('stock-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => cb('products'))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => cb('transactions'))
        .subscribe(st => cb('status:' + st));
      return () => sb.removeChannel(ch);
    }
  };
}

      if (!prod) {
        if (!p.name) throw new Error('สินค้าใหม่ต้องระบุชื่อสินค้า');
        prod = { ...p, id: p.code, qty: Math.max(0, toNum(p.qty)),
                 reorder_point: toNum(p.reorder_point), max_stock: p.max_stock ? toNum(p.max_stock) : null };
        P.push(prod);
      } else {
        ['name', 'category', 'zone', 'shelf', 'bin', 'unit', 'owner'].forEach(k => { if (p[k]) prod[k] = p[k]; });
        if (p.reorder_point !== undefined && p.reorder_point !== '') prod.reorder_point = toNum(p.reorder_point);
        if (p.max_stock !== undefined && p.max_stock !== '') prod.max_stock = toNum(p.max_stock);

      ping('products');
      return { code: prod.code, balance: prod.qty };
    },
    async stockIn(p) {
      await L();
      if (!(toNum(p.qty) > 0)) throw new Error('จำนวนต้องมากกว่า 0');
      let prod = find(p.code);
      if (!prod) {
        if (!p.name) throw new Error('สินค้าใหม่ต้องระบุชื่อสินค้า');
        prod = { ...p, id: p.code, qty: 0, reorder_point: toNum(p.reorder_point), max_stock: p.max_stock ? toNum(p.max_stock) : null };
        P.push(prod);
      }
      prod.qty = toNum(prod.qty) + toNum(p.qty);
      prod.updated_at = new Date().toISOString();
      push('in', prod, toNum(p.qty), p); ping('products');
      return { code: prod.code, name: prod.name, balance: prod.qty };
    },
    async stockOut(p) {
      await L();
      if (!(toNum(p.qty) > 0)) throw new Error('จำนวนที่เบิกต้องมากกว่า 0');
      const prod = find(p.code);
      if (!prod) throw new Error('ไม่พบรหัสสินค้า ' + p.code);
      if (toNum(prod.qty) < toNum(p.qty)) throw new Error('จำนวนที่เบิกเกินยอดคงเหลือ (คงเหลือ ' + num(prod.qty) + ' ' + prod.unit + ')');
      prod.qty = toNum(prod.qty) - toNum(p.qty);
      prod.updated_at = new Date().toISOString();
      push('out', prod, toNum(p.qty), p); ping('products');
      return { code: prod.code, name: prod.name, balance: prod.qty, unit: prod.unit,
               low_stock: prod.qty <= toNum(prod.reorder_point), reorder_point: prod.reorder_point };
    },
    async stockOutBulk(p) {
      const items = [];
      for (const it of p.items) items.push(await this.stockOut({ ...(p.common || {}), ...it }));
      return { items, count: items.length };
    },
    async stockAdjust(p) {
      await L();
      if (toNum(p.counted) < 0) throw new Error('จำนวนที่นับได้ไม่ถูกต้อง');
      const prod = find(p.code);
      if (!prod) throw new Error('ไม่พบรหัสสินค้า ' + p.code);
      const diff = toNum(p.counted) - toNum(prod.qty);
      prod.qty = toNum(p.counted);
      if (diff !== 0) push('adjust', prod, Math.abs(diff), { note: 'ปรับยอดจากการนับจริง' });
      ping('products'); return { balance: prod.qty, diff };
    },
    async importRows(p) {
      let ok = 0, noMove = 0; const errors = [];
      for (let i = 0; i < p.rows.length; i++) {
        const r = p.rows[i];
        try {
          const exists = !!find(r.code);
          if (p.mode === 'set') {
            if (exists) await this.stockAdjust({ code: r.code, counted: r.qty });
            else { await this.ensureProduct(r); noMove++; }
          } else if (toNum(r.qty) > 0) {
            await this.stockIn(r);
          } else {
            await this.ensureProduct(r); noMove++;   // จำนวน 0 = สร้างสินค้าไว้ ไม่นับเป็นการเคลื่อนไหว
          }
          ok++;
        } catch (e) { errors.push({ row: i + 1, code: r.code, message: e.message }); }
      }
      return { imported: ok, no_move: noMove, error_count: errors.length, errors };
    },
    async stats() {
      await L();
      const t0 = new Date(); t0.setHours(0, 0, 0, 0);
      const today = T.filter(x => new Date(x.created_at) >= t0);
      return {
        total_items: P.length,
        total_qty: P.reduce((s, x) => s + toNum(x.qty), 0),
        low_stock: P.filter(x => statusOf(x) === 'low').length,
        over_max: P.filter(x => statusOf(x) === 'over').length,
        qty_in_today: today.filter(x => x.type === 'in').reduce((s, x) => s + x.qty, 0),
        qty_out_today: today.filter(x => x.type === 'out').reduce((s, x) => s + x.qty, 0),
        tx_today: today.length,
        pending_users: U.filter(u => u.status === 'pending').length,
        unseen_tx: T.filter(x => x.actor_id !== ME.id &&
          (!ME.history_seen_at || new Date(x.created_at) > new Date(ME.history_seen_at))).length
      };
    },
    async transactions(f) {
      await L(); f = f || {};
      return T.filter(t => {
        if (f.type && t.type !== f.type) return false;
        if (f.actor && t.actor_id !== f.actor) return false;
        if (f.q) { const q = f.q.toLowerCase();
          if (!(t.code + ' ' + t.name + ' ' + t.counterparty).toLowerCase().includes(q)) return false; }
        if (f.from && t.created_at < f.from) return false;
        if (f.to && t.created_at > f.to + 'T23:59:59') return false;
        return true;
      }).slice(0, f.limit || 500).map(x => ({ ...x }));
    },
    async users() { await L(); return U.map(x => ({ ...x })); },
    async markHistorySeen() { await L(); ME.history_seen_at = new Date().toISOString(); return ME.history_seen_at; },
    async settings() { await L(); return { ...SET }; },
    async saveSettings(p) { await L(); Object.assign(SET, p); return { ...SET }; },
    async nextCode(prefix) {
      const pre = prefix == null ? (SET.code_prefix || '') : prefix;
      const d = Number(SET.code_digits) || 4;
      let max = 0;
      P.forEach(p => {
        if (pre && !String(p.code).toLowerCase().startsWith(pre.toLowerCase())) return;
        const m = String(p.code).match(/(\d+)$/);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return pre + String(max + 1).padStart(d, '0');
    },
    async uploadImage(blob) { await L(); return await blobToDataUrl(blob); },
    async setImage(code, url) { await L(); const p = find(code); if (p) p.image_url = url; ping('products'); return { ok: true }; },
    async resetData(p) {
      await L();
      if (p.confirm !== 'ล้างข้อมูล') throw new Error('พิมพ์คำยืนยันไม่ถูกต้อง ต้องพิมพ์ว่า ล้างข้อมูล');
      const tx = T.length, pd = P.length;
      if (p.scope === 'history') T = [];
      else if (p.scope === 'zero') { T = []; P.forEach(x => { x.qty = 0; }); }
      else if (p.scope === 'all') { T = []; P = []; }
      else throw new Error('ขอบเขตการล้างข้อมูลไม่ถูกต้อง');
      ping('products');
      return { transactions_deleted: tx, products_deleted: p.scope === 'all' ? pd : 0 };
    },
    subscribe(cb) { subs.push(cb); setTimeout(() => cb('status:SUBSCRIBED'), 300); return () => { subs = subs.filter(x => x !== cb); }; }
  };
}

/** ลบ session เก่าที่ค้างอยู่ใน localStorage ทิ้ง (เผื่อเคยเข้าระบบไว้ก่อนเปิดโหมดต้องล็อกอินทุกครั้ง) */
function clearStaleAuth() {

/* ---- ออกจากระบบอัตโนมัติเมื่อไม่มีการใช้งาน (กันลืมล็อกเอาต์บนเครื่องที่ใช้ร่วมกัน) ----
   ตรวจ 3 จังหวะ เพราะเบราว์เซอร์จะหรี่ timer ของแท็บที่ถูกซ่อนไว้ พึ่ง setInterval อย่างเดียวไม่ได้:
   1) ตามรอบเวลา  2) ตอนผู้ใช้กลับมาแตะเครื่อง  3) ตอนสลับกลับมาที่แท็บนี้ */
const IDLE_EVENTS = ['click', 'keydown', 'pointerdown', 'wheel', 'touchstart'];
let _idleAt = Date.now(), _idleTimer = null;
const touchIdle = () => { _idleAt = Date.now(); };
async function doIdleLogout() {
  stopIdleWatch();
  try { await S.db.signOut(); } catch (e) { }
  S.me = null; S.session = null;
  if (S.unsub) { try { S.unsub(); } catch (e) { } S.unsub = null; }
  $$('.modal-back').forEach(m => m.remove());
  renderAuth('login');
  authErr('ออกจากระบบอัตโนมัติ เนื่องจากไม่มีการใช้งานนานเกิน ' + IDLE_MINUTES + ' นาที');
}
function checkIdle() {
  if (!IDLE_MINUTES || !S.me) return false;
  if (Date.now() - _idleAt < IDLE_MINUTES * 60000) return false;
  doIdleLogout();
  return true;
}
const onIdleEvent = () => { if (!checkIdle()) touchIdle(); };   // ตรวจก่อน แล้วค่อยนับเวลาใหม่
function startIdleWatch() {
  stopIdleWatch();
  if (!IDLE_MINUTES) return;
  IDLE_EVENTS.forEach(ev => document.addEventListener(ev, onIdleEvent, { passive: true }));
  document.addEventListener('visibilitychange', checkIdle);
  touchIdle();
  _idleTimer = setInterval(checkIdle, 20000);
}
function stopIdleWatch() {
  if (_idleTimer) { clearInterval(_idleTimer); _idleTimer = null; }
  IDLE_EVENTS.forEach(ev => document.removeEventListener(ev, onIdleEvent));
  document.removeEventListener('visibilitychange', checkIdle);
}

V.dashboard = {
  async load() { [S.stats, S.products, S.txs] = await Promise.all([S.db.stats(), S.db.products(), S.db.transactions({ limit: 8 })]); },
  html() {
    const st = S.stats || {};
    const low = S.products.filter(p => statusOf(p) === 'low').sort((a, b) => (toNum(a.qty) - toNum(a.reorder_point)) - (toNum(b.qty) - toNum(b.reorder_point)));
    const kpi = (cls, icon, label, value, sfx) =>
      '<div class="kpi ' + cls + '"><div class="lbl">' + I[icon] + '<span>' + label + '</span></div>' +
      '<div class="num">' + value + (sfx ? '<span class="sfx">' + sfx + '</span>' : '') + '</div></div>';
    const zero = S.products.filter(p => toNum(p.qty) === 0);
    // สรุปแยกตามหมวดหมู่
    const catMap = {};
    S.products.forEach(p => {
      const c = String(p.category || '').trim() || '(ไม่ระบุหมวด)';
      const b = catMap[c] || (catMap[c] = { cat: c, sku: 0, qty: 0, low: 0, over: 0, zero: 0 });
      b.sku++; b.qty += toNum(p.qty);
      const s = statusOf(p);
      if (s === 'low') b.low++;
      if (s === 'over') b.over++;
      if (toNum(p.qty) === 0) b.zero++;
    });
    const catRows = Object.keys(catMap).map(k => catMap[k]).sort((a, b) => (b.low - a.low) || (b.sku - a.sku));
    const maxSku = Math.max.apply(null, catRows.map(c => c.sku).concat([1]));

    return '<div class="kpis">' +
        kpi('', 'box', 'รายการสินค้า', num(st.total_items), 'SKU') +
        kpi('', 'scale', 'จำนวนคงเหลือรวม', num(st.total_qty), 'หน่วย') +
        kpi('warn', 'warn', 'ต้องสั่งเพิ่ม', num(st.low_stock), 'รายการ') +
        kpi('danger', 'x', 'ของหมดสต็อก', num(zero.length), 'รายการ') +
        kpi('over', 'up', 'เกินค่า MAX', num(st.over_max), 'รายการ') +
      '</div>' +
      '<div class="card" style="margin-top:16px"><div class="card-head">' +
        '<h3>สรุปตามหมวดหมู่</h3><span class="hint">' + catRows.length + ' หมวด · คลิกที่แถวเพื่อดูเฉพาะหมวดนั้น</span></div>' +
        (catRows.length ? '<div class="table-wrap"><table class="data"><thead><tr>' +
          '<th>หมวดหมู่</th><th class="r">SKU</th><th class="r">คงเหลือรวม</th>' +
          '<th class="r">ต้องสั่งเพิ่ม</th><th class="r">ของหมด</th><th class="r">เกิน MAX</th></tr></thead><tbody>' +
          catRows.map(c => '<tr class="clickable" data-a="go-cat" data-c="' + esc(c.cat) + '">' +
            '<td><b>' + esc(c.cat) + '</b>' +
              '<div class="catbar"><span style="width:' + Math.round(c.sku / maxSku * 100) + '%"></span></div></td>' +
            '<td class="r num">' + num(c.sku) + '</td>' +
            '<td class="r num">' + num(c.qty) + '</td>' +
            '<td class="r num">' + (c.low ? '<b style="color:var(--low)">' + num(c.low) + '</b>' : '<span class="sub">0</span>') + '</td>' +
            '<td class="r num">' + (c.zero ? '<b style="color:var(--danger)">' + num(c.zero) + '</b>' : '<span class="sub">0</span>') + '</td>' +
            '<td class="r num">' + (c.over ? '<b style="color:var(--over)">' + num(c.over) + '</b>' : '<span class="sub">0</span>') + '</td>' +
          '</tr>').join('') + '</tbody></table></div>'
          : '<div class="empty">' + I.empty + '<div>ยังไม่มีข้อมูลหมวดหมู่</div></div>') +
      '</div>' +
      '<div class="grid g-dash" style="margin-top:16px">' +
        '<div class="card"><div class="card-head"><h3>ของที่ต้องสั่งเพิ่ม</h3>' +
          '<span class="hint">' + low.length + ' รายการ</span><div class="spacer"></div>' +
          (low.length ? '<button class="btn sm primary" data-a="pr-open">' + I.file + 'ทำใบขอซื้อ</button>' : '') +
          '<button class="btn sm" data-a="go" data-k="products" data-f="low">ดูทั้งหมด</button></div>' +
          (low.length ? '<div class="table-wrap"><table class="data"><thead><tr>' +
            '<th>รหัส</th><th>ชื่อสินค้า</th><th class="r">คงเหลือ</th><th class="r">จุดสั่งซื้อ</th><th>ผู้ดูแล</th><th></th></tr></thead><tbody>' +
            low.slice(0, 8).map(p => '<tr>' +
              '<td class="code">' + esc(p.code) + '</td>' +
              '<td>' + esc(p.name) + '<div class="sub">' + esc(p.category || '-') + '</div></td>' +
              '<td class="r num"><b style="color:var(--low)">' + num(p.qty) + '</b> <span class="sub">' + esc(p.unit) + '</span></td>' +
              '<td class="r num sub">' + num(p.reorder_point) + '</td>' +
              '<td class="sub">' + esc(p.owner || '-') + '</td>' +
              '<td class="r"><button class="btn sm" data-a="quick-in" data-code="' + esc(p.code) + '">รับเข้า</button></td>' +
            '</tr>').join('') + '</tbody></table></div>'
            : '<div class="empty">' + I.check + '<div>ทุกรายการมีของเพียงพอ</div></div>') +
        '</div>' +
        '<div>' +
          '<div class="card"><div class="card-head"><h3>ความเคลื่อนไหววันนี้</h3></div><div class="card-body">' +
            '<div class="stat-line"><span>รับเข้า</span><span style="color:var(--in)">+' + num(st.qty_in_today) + '</span></div>' +
            '<div class="stat-line"><span>เบิกออก</span><span style="color:var(--low)">-' + num(st.qty_out_today) + '</span></div>' +
            '<div class="stat-line"><span>จำนวนรายการ</span><span>' + num(st.tx_today) + '</span></div>' +
          '</div></div>' +
          '<div class="card"><div class="card-head"><h3>รายการล่าสุด</h3><div class="spacer"></div>' +
            '<button class="btn sm" data-a="go" data-k="history">ทั้งหมด</button></div>' +
            (S.txs.length ? '<div class="table-wrap"><table class="data"><tbody>' +
              S.txs.slice(0, 7).map(t => '<tr>' +
                '<td><span class="pill ' + t.type + '">' + (t.type === 'in' ? '+' : t.type === 'out' ? '−' : '±') + num(t.qty) + '</span></td>' +
                '<td>' + esc(t.name || t.code) + '<div class="sub">' + esc(t.actor_name) + ' · ' + fmtDT(t.created_at) + '</div></td>' +
              '</tr>').join('') + '</tbody></table></div>'
              : '<div class="empty">' + I.empty + '<div>ยังไม่มีรายการ</div></div>') +
          '</div>' +
        '</div>' +
      '</div>';
  },

};

/* ---------------------------------------------------- สินค้าคงคลัง */
V.products = {
  f: { q: '', cat: '', st: '' },
  async load() { S.products = await S.db.products(); },
  html() {
    const f = V.products.f;
    const cats = Array.from(new Set(S.products.map(p => p.category).filter(Boolean))).sort();
    const rows = S.products.filter(p => {
      if (f.st && statusOf(p) !== f.st) return false;
      if (f.cat && p.category !== f.cat) return false;
      if (f.q) { const q = f.q.toLowerCase();
        if (!((p.code + ' ' + p.name + ' ' + p.category + ' ' + p.owner).toLowerCase().includes(q))) return false; }
      return true;
    });
    return '<div class="card"><div class="card-head">' +
        '<div class="searchbar">' + I.search + '<input type="text" id="pq" placeholder="ค้นหารหัส ชื่อ หมวดหมู่ หรือผู้ดูแล" value="' + esc(f.q) + '" data-a2="pfilter"></div>' +
        '<select id="pcat" data-a2="pfilter" style="width:auto"><option value="">ทุกหมวดหมู่</option>' +
          cats.map(c => '<option' + (f.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
        '<div class="seg">' + ['', 'low', 'over'].map(s =>
          '<button class="' + (f.st === s ? 'on' : '') + '" data-a="pst" data-v="' + s + '">' +
          (s === '' ? 'ทั้งหมด' : s === 'low' ? 'ต้องสั่งเพิ่ม' : 'เกิน MAX') + '</button>').join('') + '</div>' +
        '<div class="spacer"></div>' +
        '<button class="btn sm" data-a="pr-open">' + I.file + 'ใบขอซื้อ</button>' +
        '<button class="btn sm" data-a="print-count">' + I.scale + 'ใบตรวจนับ</button>' +
        (isAdmin() ? '<button class="btn primary sm" data-a="prod-new">' + I.plus + 'เพิ่มสินค้า</button>' : '') +
      '</div>' +
      // แถบบอกว่าตอนนี้กำลังดูข้อมูลชุดไหนอยู่
      ((f.q || f.cat || f.st)
        ? '<div class="filterbar">' + I.search + '<span>กำลังดู:</span>' +
            (f.cat ? '<b>หมวด ' + esc(f.cat) + '</b>' : '') +
            (f.st ? '<b>' + (f.st === 'low' ? 'เฉพาะที่ต้องสั่งเพิ่ม' : 'เฉพาะที่เกินค่า MAX') + '</b>' : '') +
            (f.q ? '<b>คำค้น "' + esc(f.q) + '"</b>' : '') +
            '<span>· พบ ' + rows.length + ' จาก ' + S.products.length + ' รายการ</span>' +
            '<div class="spacer" style="flex:1"></div>' +
            '<button class="x" data-a="pclear">ล้างตัวกรอง ✕</button>' +
          '</div>'
        : '') +
      (rows.length ? '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th style="width:46px"></th><th>รหัส</th><th>ชื่อสินค้า</th><th>ตำแหน่ง</th><th class="r">คงเหลือ</th><th class="r">จุดสั่งซื้อ</th>' +
        '<th class="r">MAX</th><th>ผู้ดูแล</th><th>สถานะ</th><th class="r">จัดการ</th></tr></thead><tbody>' +
        rows.map(p => { const st = statusOf(p); return '<tr class="clickable" data-a="prod-open" data-code="' + esc(p.code) + '">' +
          '<td>' + thumbHTML(p) + '</td>' +
          '<td class="code">' + esc(p.code) + '</td>' +
          '<td>' + esc(p.name) + '<div class="sub">' + esc(p.category || '-') + '</div></td>' +
          '<td class="sub">' + esc([p.zone, p.shelf, p.bin].filter(Boolean).join(' / ') || '-') + '</td>' +
          '<td class="r num"><b>' + num(p.qty) + '</b> <span class="sub">' + esc(p.unit) + '</span></td>' +
          '<td class="r num sub">' + num(p.reorder_point) + '</td>' +
          '<td class="r num sub">' + (p.max_stock == null || p.max_stock === '' ? '-' : num(p.max_stock)) + '</td>' +
          '<td class="sub">' + esc(p.owner || '-') + '</td>' +
          '<td><span class="pill ' + st + '">' + STATUS_TH[st] + '</span></td>' +
          '<td><div class="row-actions">' +
            '<button class="btn sm" data-a="quick-in" data-code="' + esc(p.code) + '" title="รับเข้า">' + I.down + '</button>' +
            '<button class="btn sm" data-a="quick-out" data-code="' + esc(p.code) + '" title="เบิกออก">' + I.up + '</button>' +
            (isAdmin() ? '<button class="btn sm" data-a="prod-edit" data-code="' + esc(p.code) + '" title="แก้ไข">' + I.edit + '</button>' +
                         '<button class="btn sm danger" data-a="prod-del" data-code="' + esc(p.code) + '" title="ลบ">' + I.trash + '</button>' : '') +
          '</div></td></tr>'; }).join('') + '</tbody></table></div>'
        : '<div class="empty">' + I.empty + '<div>ไม่พบสินค้าตามเงื่อนไข</div></div>') +
      '<div class="card-head" style="border-bottom:0;border-top:1px solid var(--border)"><span class="hint">แสดง ' +
        rows.length + ' จาก ' + S.products.length + ' รายการ · รวม ' +
        num(rows.reduce((s, p) => s + toNum(p.qty), 0)) + ' หน่วย</span></div>' +
      '</div>';
  }
};

          '<td>' + esc(t.name || t.code) + '<div class="sub">' + esc(t.counterparty || t.actor_name) + ' · ' + fmtDT(t.created_at) + '</div></td>' +
          '<td class="r num sub">' + num(t.balance) + '</td></tr>').join('') + '</tbody></table></div>'
          : '<div class="empty">' + I.empty + '<div>ยังไม่มีรายการรับเข้า</div></div>') + '</div>' +
    '</div>';
  },
  after() {

    const pre = sessionStorage.getItem('prefill.in');
    if (pre) { sessionStorage.removeItem('prefill.in'); $('#iCode').value = pre; fillFromCode('i'); $('#iQty').focus(); }

function fillFromCode(pfx) {
  const code = $('#' + pfx + 'Code').value.trim();
  const p = S.products.find(x => x.code.toLowerCase() === code.toLowerCase());
  const box = $('#' + pfx + 'Cur');
  if (!p) { if (box) box.classList.add('hide'); return null; }
  if (pfx === 'i') {
    $('#iName').value = p.name; $('#iUnit').value = p.unit || ''; $('#iCat').value = p.category || '';
    $('#iZone').value = p.zone || ''; $('#iShelf').value = p.shelf || ''; $('#iBin').value = p.bin || '';
    $('#iRp').value = p.reorder_point ?? ''; $('#iMax').value = p.max_stock ?? ''; $('#iOwner').value = p.owner || '';
  }
  if (box) {
    box.classList.remove('hide');
    box.innerHTML = 'มีสินค้านี้อยู่แล้ว — คงเหลือปัจจุบัน <b>' + num(p.qty) + ' ' + esc(p.unit) + '</b>' +
      (statusOf(p) === 'low' ? ' · <b style="color:var(--low)">ต่ำกว่าจุดสั่งซื้อ</b>' : '');
  }
  return p;
}

V.history = {
  f: { type: '', q: '', from: '', to: '' },
  newSince: 0,
  async load() {
    // จำเวลาที่ดูครั้งก่อนไว้ก่อน เพื่อไฮไลต์เฉพาะรายการที่เพิ่งเพิ่มมาหลังจากนั้น
    V.history.newSince = (S.me && S.me.history_seen_at) ? new Date(S.me.history_seen_at).getTime() : 0;
    S.txs = await S.db.transactions({ ...V.history.f, limit: 1000 });
    try {
      const seenAt = await S.db.markHistorySeen();      // เปิดดูแล้ว = เคลียร์ตัวเลขแดง
      if (S.me && seenAt) S.me.history_seen_at = seenAt;
      S.stats = await S.db.stats();
      paintNav();
    } catch (e) { /* ถ้าบันทึกไม่ได้ก็ยังดูประวัติได้ตามปกติ */ }
  },
  isNew(t) {
    // รายการที่ตัวเองเป็นคนทำไม่นับว่าใหม่ (ใช้เกณฑ์เดียวกับตัวเลขแดงบนเมนู)
    if (String(t.actor_id || '') === String((S.me || {}).id || '')) return false;
    if (!V.history.newSince) return true;              // ยังไม่เคยเปิดดูเลย ถือว่าใหม่ทั้งหมด
    return new Date(t.created_at).getTime() > V.history.newSince;
  },
  html() {
    const f = V.history.f;
    const newCount = S.txs.filter(V.history.isNew).length;
    return '<div class="card"><div class="card-head" style="flex-wrap:wrap">' +

      '</div>' +
      (newCount ? '<div class="filterbar" style="background:var(--danger-soft);color:var(--danger)">' + I.warn +
          '<b>มี ' + newCount + ' รายการใหม่</b><span>ที่คนอื่นทำไว้ตั้งแต่คุณเปิดดูครั้งล่าสุด — แถวที่ไฮไลต์คือของใหม่</span></div>' : '') +
      (S.txs.length ? '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th>วันที่-เวลา</th><th>ประเภท</th><th>รหัส</th><th>ชื่อสินค้า</th><th class="r">จำนวน</th>' +
        '<th class="r">คงเหลือ</th><th>ผู้ทำรายการ</th><th>ผู้รับ / ผู้ส่ง</th><th>หมายเหตุ</th></tr></thead><tbody>' +
        S.txs.map(t => '<tr' + (V.history.isNew(t) ? ' class="isnew"' : '') + '>' +

  }

          '<input id="uPos" value="' + esc((u && u.position) || '') + '" placeholder="เช่น เจ้าหน้าที่คลังสินค้า"></div>' +

          '<option value="staff"' + (u && u.role === 'staff' || isNew ? ' selected' : '') + '>พนักงาน — ใช้งานระบบได้ตามปกติ</option>' +
          '<option value="admin"' + (u && u.role === 'admin' ? ' selected' : '') + '>ผู้ดูแลระบบ — จัดการผู้ใช้และล้างข้อมูลได้</option>' +
        '</select></div>' +
        (isNew ? '' : '<div class="field"><label>สถานะ</label><select id="uStatus">' +

        '</select></div>') +
      '</div>' +
      '<div class="help" style="margin-top:12px">สิทธิ์ <b>ผู้ดูแลระบบ</b> จะเห็นเมนูผู้ใช้งานและปุ่มล้างข้อมูลระบบเพิ่มขึ้นมา ' +

    onOk: async () => {
      const name = $('#uName').value.trim(), pos = $('#uPos').value.trim(), role = $('#uRole').value;
      if (!name) { toast('กรุณากรอกชื่อ-สกุล', 'err'); return false; }
      try {
        if (isNew) {
          const username = $('#uUser').value.trim(), pw = $('#uPw').value;
          if (!USERNAME_RE.test(username)) { toast('ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษ ตัวเลข . _ - ความยาว 3-32 ตัวอักษร', 'err'); return false; }
          if (pw.length < 6) { toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'err'); return false; }
          const r = await S.db.createUser({ username, password: pw, full_name: name, position: pos, role });
          toast('สร้างบัญชี ' + username + ' แล้ว' + (r && r.needsConfirm ? ' (ต้องปิด Confirm email ใน Supabase ก่อนจึงจะเข้าใช้ได้)' : ''),
                r && r.needsConfirm ? 'warn' : '');
        } else {
          await S.db.updateUser(u.id, { full_name: name, position: pos, role, status: $('#uStatus').value });
          toast('บันทึกข้อมูลบัญชีแล้ว');
        }
        S.stats = await S.db.stats(); paintNav(); route();
      } catch (e) { toast(errMsg(e), 'err'); return false; }
    }
  });
}

async function route() {
  const key = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('?')[0];
  const nav = NAV.find(n => n.k === key) || NAV[0];
  if (nav.admin && !isAdmin()) return (location.hash = '#/dashboard');
  S.route = nav.k;
  paintNav();
  $('#ttl').textContent = nav.t;
  $('#tsub').textContent = nav.sub;
  // บอกตำแหน่งปัจจุบันให้ชัด ทั้งบนหน้าจอและบนแท็บเบราว์เซอร์
  $('#crumb').innerHTML = esc(orgName() || orgTitle()) + '<span>›</span>' + esc(nav.t);
  document.title = nav.t + ' · ' + orgTitle() + (orgName() ? ' — ' + orgName() : '');
  $('#sidebar').classList.remove('open');
  const scrim = $('.scrim'); if (scrim) scrim.remove();
  const view = V[nav.k];
  const host = $('#view');
  host.innerHTML = loadingHTML();
  try {
    await view.load();
    host.innerHTML = view.html();
    if (view.after) view.after();
  } catch (e) {
    host.innerHTML = '<div class="card"><div class="card-body"><div class="alert err">' + esc(errMsg(e)) + '</div>' +
      '<button class="btn" data-a="reload">ลองใหม่</button></div></div>';
  }
}
const refresh = () => route();

function exportXlsx(sheets, filename) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet(s.data);
    ws['!cols'] = (s.data[0] || []).map((_, i) => ({ wch: Math.min(40, Math.max(10, ...s.data.slice(0, 200).map(r => String(r[i] == null ? '' : r[i]).length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31));
  });
  XLSX.writeFile(wb, filename);
  toast('ดาวน์โหลดไฟล์ ' + filename + ' แล้ว');
}

const normHead = v => String(v == null ? '' : v).toLowerCase().replace(/[\s ().:_/\-*]/g, '');
function matchField(cell) {
  const s = normHead(cell);
  if (!s) return null;
  for (const f of FIELDS) for (const a of f.al) if (s === normHead(a)) return f.k;
  for (const f of FIELDS) for (const a of f.al) if (s.indexOf(normHead(a)) > -1) return f.k;
  return null;
}
const colName = i => { let s = '', n = i; do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0); return s; };

async function openImportWizard(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  S.imp = { wb, fileName: file.name, sheet: wb.SheetNames[0], mode: 'in', headerRow: 0, map: {}, aoa: [] };
  analyzeSheet();
  modal({
    title: 'นำเข้าข้อมูลจากไฟล์ Excel', sub: file.name, icon: 'upload', wide: 'xl',
    cancelText: 'ปิด', body: '<div id="impBody"></div>'
  });
  renderWizard();
}
function analyzeSheet() {
  const ws = S.imp.wb.Sheets[S.imp.sheet];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: true });
  let best = { score: 0, idx: 0 };
  for (let r = 0; r < Math.min(aoa.length, 40); r++) {
    let score = 0;
    (aoa[r] || []).forEach(c => { if (matchField(c)) score++; });
    if (score > best.score) best = { score, idx: r };
  }
  S.imp.aoa = aoa;
  S.imp.headerRow = best.idx;
  S.imp.detected = best.score;
  automap();
}
function automap() {
  S.imp.map = {};
  (S.imp.aoa[S.imp.headerRow] || []).forEach((c, i) => {
    const f = matchField(c);
    if (f && S.imp.map[f] === undefined) S.imp.map[f] = i;
  });
}
function impRows() {
  const { aoa, headerRow, map, mode } = S.imp;
  const rows = [], bad = [];
  for (let r = headerRow + 1; r < aoa.length; r++) {
    const src = aoa[r] || [];
    if (!src.length || src.every(c => String(c).trim() === '')) continue;
    const get = k => (map[k] === undefined ? '' : src[map[k]]);
    const code = String(get('code') == null ? '' : get('code')).trim();
    const qty = toNum(get('qty'));
    const label = 'แถวที่ ' + (r + 1);
    if (!code) { if (String(get('name')).trim() || qty) bad.push(label + ': ไม่มีรหัสสินค้า'); continue; }
    if (/^(รวม|total|sum|รวมทั้งสิ้น)/i.test(code)) continue;         // ข้ามแถวสรุปท้ายฟอร์ม
    if (qty < 0) { bad.push(label + ' (' + code + '): จำนวนติดลบไม่ได้'); continue; }
    // จำนวนเป็น 0 รับได้สำหรับใบรับเข้า/ใบปรับยอด (สร้างสินค้าไว้ในระบบโดยยอดคงเหลือเป็น 0)
    if (mode === 'out' && !(qty > 0)) { bad.push(label + ' (' + code + '): จำนวนที่เบิกต้องมากกว่า 0'); continue; }
    const row = { code, qty, name: String(get('name') || '').trim() };
    ['unit', 'category', 'zone', 'shelf', 'bin', 'owner', 'counterparty', 'note', 'image_url'].forEach(k => {
      const v = String(get(k) == null ? '' : get(k)).trim(); if (v) row[k] = v;
    });
    if (map.reorder_point !== undefined && String(get('reorder_point')).trim() !== '') row.reorder_point = toNum(get('reorder_point'));
    if (map.max_stock !== undefined && String(get('max_stock')).trim() !== '') row.max_stock = toNum(get('max_stock'));
    rows.push(row);
  }
  return { rows, bad };
}

      '<div class="map-row' + (f.req ? ' req' : '') + '"><label>' + esc(f.t) + (f.req ? ' *' : '') + '</label>' +
      '<select data-a3="map" data-k="' + f.k + '" style="flex:1">' + colOptions(im.map[f.k]) + '</select></div>').join('') +

    (missingReq.length
      ? '<div class="alert err" style="margin-top:16px">ยังไม่ได้เลือกคอลัมน์: ' + esc(missingReq.join(', ')) + '</div>'
      : '<div class="alert ' + (bad.length ? 'warn' : 'info') + '" style="margin-top:16px">อ่านได้ <b>' + rows.length + '</b> รายการ' +
        (bad.length ? ' · ข้าม ' + bad.length + ' แถว' : '') +
        (rows.length ? ' · รวมจำนวน <b>' + num(rows.reduce((s, r) => s + r.qty, 0)) + '</b>' : '') +
        (im.mode !== 'out' && rows.filter(r => !r.qty).length
          ? '<div style="margin-top:6px">มี <b>' + rows.filter(r => !r.qty).length + '</b> รายการที่จำนวนเป็น 0 — ' +
            'ระบบจะสร้างสินค้านั้นไว้ในระบบโดยยอดคงเหลือเป็น 0 และไม่บันทึกเป็นการเคลื่อนไหว</div>' : '') +
        '</div>') +
    (bad.length ? '<div class="help" style="margin-bottom:10px">' + bad.slice(0, 6).map(esc).join('<br>') +
      (bad.length > 6 ? '<br>… และอีก ' + (bad.length - 6) + ' แถว' : '') + '</div>' : '') +

    (rows.length ? '<div class="table-wrap" style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">' +
      '<table class="data"><thead><tr><th>รหัส</th><th>ชื่อสินค้า</th><th class="r">จำนวน</th><th>หน่วย</th><th>ตำแหน่ง</th><th>ผู้รับ/ผู้ส่ง</th></tr></thead><tbody>' +
      rows.slice(0, 60).map(r => '<tr><td class="code">' + esc(r.code) + '</td><td>' + esc(r.name || '-') + '</td>' +
        '<td class="r num">' + num(r.qty) + '</td><td class="sub">' + esc(r.unit || '') + '</td>' +
        '<td class="sub">' + esc([r.zone, r.shelf, r.bin].filter(Boolean).join('/')) + '</td>' +
        '<td class="sub">' + esc(r.counterparty || '') + '</td></tr>').join('') +
      '</tbody></table></div>' : '') +

    '<div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">' +
      '<button class="btn primary" data-a="imp-run"' + (rows.length && !missingReq.length ? '' : ' disabled') + '>' +
        I[IMPORT_MODES[im.mode].icon] + 'นำเข้าเป็น' + esc(IMPORT_MODES[im.mode].t) + ' ' + rows.length + ' รายการ</button>' +
      '<button class="btn ghost" data-a="imp-auto">ตรวจหัวตารางใหม่</button>' +
    '</div>';
}

/* ====================================================================
   เอกสารสำหรับพิมพ์ (ใบตรวจนับสต็อก / รายงานคงเหลือ)
   ==================================================================== */
function docHeader(title, cond, docNo) {
  const o = S.org || {};
  return '<div class="doc-head">' +
      (o.logo_url ? '<img src="' + esc(o.logo_url) + '" alt="" style="height:16mm;max-width:40mm;object-fit:contain;margin-right:5mm">' : '') +
      '<div style="flex:1"><div class="co">' + esc(o.company_name || orgTitle()) + '</div>' +
        (o.branch ? '<div>' + esc(o.branch) + '</div>' : '') +
        (o.address ? '<div style="font-size:9.5px;color:#444">' + esc(o.address) + '</div>' : '') + '</div>' +
      '<div class="meta">' +
        (docNo ? '<div>เลขที่เอกสาร ' + esc(docNo) + '</div>' : '') +
        '<div>พิมพ์เมื่อ ' + esc(fmtDT(new Date())) + '</div>' +
        '<div>ผู้พิมพ์ ' + esc(S.me.full_name || showUser(S.me)) + (S.me.position ? ' (' + esc(S.me.position) + ')' : '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="doc-title">' + esc(title) + '</div>' +
    (cond ? '<div class="doc-cond">' + esc(cond) + '</div>' : '');
}
function signRow(roles) {
  return '<div class="signs">' + roles.map(r =>
    '<div class="sign"><div class="line"></div>' +
      '<div>(..................................................)</div>' +
      '<div class="nm"><b>' + esc(r) + '</b></div>' +
      '<div>วันที่ ........./........./.............</div></div>').join('') + '</div>';
}
function buildCountDoc(list, opt) {
  const showQty = !!opt.showQty, blank = !!opt.blank;
  const th = ['ลำดับ', 'รหัสสินค้า', 'ชื่อสินค้า', 'ตำแหน่งจัดเก็บ', 'หน่วยนับ']
    .concat(showQty ? ['ยอดในระบบ'] : [])
    .concat(blank ? ['จำนวนนับได้'] : [])
    .concat(blank && showQty ? ['ผลต่าง'] : [])
    .concat(['หมายเหตุ']);
  const body = list.map((p, i) => '<tr>' +
      '<td class="c">' + (i + 1) + '</td>' +
      '<td>' + esc(p.code) + '</td>' +
      '<td>' + esc(p.name) + '</td>' +
      '<td class="c">' + esc([p.zone, p.shelf, p.bin].filter(Boolean).join(' / ') || '-') + '</td>' +
      '<td class="c">' + esc(p.unit || '') + '</td>' +
      (showQty ? '<td class="r">' + num(p.qty) + '</td>' : '') +
      (blank ? '<td class="fill"></td>' : '') +
      (blank && showQty ? '<td class="fill"></td>' : '') +
      '<td class="fill"></td>' +
    '</tr>').join('');
  const total = list.reduce((s, p) => s + toNum(p.qty), 0);
  return docHeader(opt.title, opt.cond, opt.docNo) +
    '<table class="doc"><thead><tr>' + th.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + body +
      (showQty && !blank ? '<tr><td class="c" colspan="5"><b>รวมทั้งสิ้น</b></td><td class="r"><b>' + num(total) + '</b></td><td></td></tr>' : '') +
    '</tbody></table>' +
    '<div style="margin-top:8px;font-size:10px">รวม ' + list.length + ' รายการ' +
      (showQty ? ' · ยอดรวมในระบบ ' + num(total) + ' หน่วย' : '') + '</div>' +
    signRow(['ผู้นับสต็อก', 'ผู้ตรวจสอบ', 'ผู้รับทราบ']) +
    ((S.org && S.org.doc_footer) ? '<div class="doc-foot">' + esc(S.org.doc_footer) + '</div>' : '');
}
async function doPrint(html, opt) {
  opt = opt || {};
  // เอกสารที่มีหลายคอลัมน์ให้พิมพ์แนวนอน
  const old = document.getElementById('pageSize');
  if (old) old.remove();
  const st = document.createElement('style');
  st.id = 'pageSize';
  st.textContent = '@page{size:A4 ' + (opt.landscape ? 'landscape' : 'portrait') + ';margin:' +
    (opt.landscape ? '10mm 9mm' : '11mm 10mm') + '}';
  document.head.appendChild(st);

  const pa = $('#printArea');
  pa.innerHTML = html;
  // รอให้รูปโหลดครบก่อนสั่งพิมพ์ ไม่งั้นเอกสารจะออกมาเป็นช่องว่าง
  const imgs = Array.from(pa.querySelectorAll('img'));
  if (imgs.length) {
    await Promise.all(imgs.map(im => im.complete ? Promise.resolve()
      : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 4000); })));
  }
  setTimeout(() => window.print(), 80);
}

/* ------------------------------------- รายงานการเบิกของประจำเดือน (Issue Report) */
const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const monthLabel = (ym) => {
  const [y, m] = String(ym || '').split('-').map(Number);
  if (!y || !m) return '';
  return THAI_MONTHS[m - 1] + ' ' + (y + 543);          // แสดงเป็น พ.ศ.
};
const monthRange = (ym) => {
  const [y, m] = String(ym || '').split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const p2 = n => (n < 10 ? '0' : '') + n;
  return { from: y + '-' + p2(m) + '-01', to: y + '-' + p2(m) + '-' + p2(last) };
};
const ISSUE_COLS = ['ลำดับ', 'วันที่', 'รหัสสินค้า', 'รายการของ', 'หน่วยงานที่ขอเบิก',
  'จำนวน', 'หน่วย', 'เหตุผลที่ขอเบิก', 'คงเหลือในคลังหลังหัก'];

function buildIssueDoc(rows, opt) {
  const body = rows.map((r, i) => '<tr>' +
      '<td class="c">' + (i + 1) + '</td>' +
      '<td class="c" style="white-space:nowrap">' + esc(r.dateTxt) + '</td>' +
      '<td>' + esc(r.code) + '</td>' +
      '<td>' + esc(r.name) + '</td>' +
      '<td>' + esc(r.dept || '-') + '</td>' +
      '<td class="r">' + num(r.qty) + '</td>' +
      '<td class="c">' + esc(r.unit || '') + '</td>' +
      '<td>' + esc(r.reason || '') + '</td>' +
      '<td class="r">' + num(r.balance) + '</td>' +
    '</tr>').join('');
  const totalQty = rows.reduce((s, r) => s + toNum(r.qty), 0);
  const depts = Array.from(new Set(rows.map(r => r.dept).filter(Boolean)));

  return docHeader('รายงานการเบิกของประจำเดือน ' + monthLabel(opt.month), opt.cond, opt.docNo) +
    '<table class="doc"><thead><tr>' + ISSUE_COLS.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + (body || '<tr><td class="c" colspan="9">ไม่มีรายการเบิกในเดือนนี้</td></tr>') +
      (rows.length ? '<tr><td class="c" colspan="5"><b>รวมทั้งสิ้น ' + rows.length + ' รายการ</b></td>' +
        '<td class="r"><b>' + num(totalQty) + '</b></td><td colspan="3"></td></tr>' : '') +
    '</tbody></table>' +
    '<div style="margin-top:7px;font-size:10px">' +
      'จำนวนรายการเบิก ' + rows.length + ' รายการ · รวม ' + num(totalQty) + ' หน่วย' +
      (depts.length ? ' · หน่วยงานที่ขอเบิก ' + depts.length + ' หน่วยงาน (' + esc(depts.slice(0, 6).join(', ')) +
        (depts.length > 6 ? ' และอื่น ๆ' : '') + ')' : '') +
      '<br>หมายเหตุ: ช่อง "คงเหลือในคลังหลังหัก" คือยอดคงเหลือ ณ เวลาที่เบิกรายการนั้น ๆ' +
    '</div>' +
    signRow(['ผู้จัดทำ', 'ผู้ตรวจสอบ', 'ผู้อนุมัติ', 'ผู้รับของ']) +
    ((S.org && S.org.doc_footer) ? '<div class="doc-foot">' + esc(S.org.doc_footer) + '</div>' : '');
}

async function openIssueReport() {
  if (!S.products.length) { try { S.products = await S.db.products(); } catch (e) { } }
  const now = new Date();
  const st = { month: now.getFullYear() + '-' + (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1), dept: '' };
  let raw = [];

  const unitOf = code => {
    const p = S.products.find(x => String(x.code).toLowerCase() === String(code).toLowerCase());
    return p ? (p.unit || '') : '';
  };
  const load = async () => {
    const r = monthRange(st.month);
    const list = await S.db.transactions({ type: 'out', from: r.from, to: r.to, limit: 5000 });
    raw = list.map(t => ({
      dateTxt: fmtDT(t.created_at).split(' ')[0],
      ts: new Date(t.created_at).getTime(),
      code: t.code, name: t.name, dept: t.counterparty || '',
      qty: toNum(t.qty), unit: unitOf(t.code), reason: t.note || '', balance: toNum(t.balance)
    })).sort((a, b) => a.ts - b.ts);     // เรียงจากต้นเดือนไปปลายเดือน
  };
  const rows = () => raw.filter(r => !st.dept || r.dept === st.dept);
  const opts = () => ({
    month: st.month,
    docNo: ($('#irNo') && $('#irNo').value.trim()) || '',
    cond: (st.dept ? 'เฉพาะหน่วยงาน: ' + st.dept + '   ·   ' : '') +
          'ช่วงวันที่ ' + monthRange(st.month).from + ' ถึง ' + monthRange(st.month).to
  });

  const body = () => {
    const list = rows();
    const depts = Array.from(new Set(raw.map(r => r.dept).filter(Boolean))).sort();
    return '<div class="form-grid" style="margin-bottom:14px">' +
        '<div class="field"><label>เดือนที่ออกรายงาน <span class="req">*</span></label>' +
          '<input type="month" id="irMonth" value="' + esc(st.month) + '" data-ir="month"></div>' +
        '<div class="field"><label>หน่วยงานที่ขอเบิก</label><select data-ir="dept"><option value="">ทุกหน่วยงาน</option>' +
          depts.map(d => '<option' + (st.dept === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>เลขที่เอกสาร</label><input id="irNo" placeholder="เช่น WH-ISS-2569-10"></div>' +
      '</div>' +
      (list.length
        ? '<div class="table-wrap" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">' +
          '<table class="data"><thead><tr><th>วันที่</th><th>รายการของ</th><th>หน่วยงาน</th>' +
          '<th class="r">จำนวน</th><th>หน่วย</th><th>เหตุผล</th><th class="r">คงเหลือหลังหัก</th></tr></thead><tbody>' +
          list.slice(0, 80).map(r => '<tr>' +
            '<td class="sub" style="white-space:nowrap">' + esc(r.dateTxt) + '</td>' +
            '<td><b>' + esc(r.name) + '</b><div class="sub">' + esc(r.code) + '</div></td>' +
            '<td class="sub">' + esc(r.dept || '-') + '</td>' +
            '<td class="r num">' + num(r.qty) + '</td>' +
            '<td class="sub">' + esc(r.unit) + '</td>' +
            '<td class="sub">' + esc(r.reason || '-') + '</td>' +
            '<td class="r num">' + num(r.balance) + '</td></tr>').join('') +
          '</tbody></table></div>' +
          (list.length > 80 ? '<div class="help" style="margin-top:8px">แสดงตัวอย่าง 80 แถวแรก · เอกสารจริงจะมีครบทั้ง ' + list.length + ' รายการ</div>' : '')
        : '<div class="empty">' + I.empty + '<div>ไม่มีรายการเบิกในเดือนนี้</div></div>') +
      '<div class="bignum" style="margin-top:14px"><b id="irN">' + list.length + '</b>' +
        '<span class="sub">รายการเบิก · รวม ' + num(list.reduce((s, r) => s + r.qty, 0)) + ' หน่วย · ' +
        'เอกสารมีช่องลงนาม ผู้จัดทำ / ผู้ตรวจสอบ / ผู้อนุมัติ / ผู้รับของ</span></div>' +
      '<div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">' +
        '<button class="btn primary" data-ir5="preview">' + I.file + 'ดูตัวอย่าง / พิมพ์เป็น PDF</button>' +
        '<button class="btn" data-ir5="xlsx">' + I.down + 'ส่งออกเป็น Excel</button>' +
      '</div>';
  };

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal" style="width:min(900px,100%)">' +
      '<div class="modal-head"><div class="ic">' + I.out + '</div>' +
        '<div><h3>รายงานการเบิกของประจำเดือน</h3>' +
        '<div class="modal-sub">สรุปของที่เบิกออกทั้งเดือน พร้อมช่องลงนาม 4 ช่อง</div></div>' +
        '<div class="spacer"></div><button class="iconbtn" data-close>' + I.x + '</button></div>' +
      '<div class="modal-body" id="irBody"><div class="skel" style="height:60px"></div></div>' +
      '<div class="modal-foot"><button class="btn" data-close>ปิด</button></div>' +
    '</div>';
  document.body.appendChild(back);

  const redraw = () => {
    const no = $('#irNo') ? $('#irNo').value : '';
    $('#irBody').innerHTML = body();
    if (no && $('#irNo')) $('#irNo').value = no;
  };
  await load();
  redraw();

  back.addEventListener('click', async e => {
    if (e.target === back || e.target.closest('[data-close]')) return back.remove();
    const go = e.target.closest('[data-ir5]');
    if (!go) return;
    const list = rows();
    if (!list.length) return toast('ไม่มีรายการเบิกในเดือนที่เลือก', 'err');
    const o = opts();
    if (go.dataset.ir5 === 'preview') {
      const html = buildIssueDoc(list, o);
      modal({ title: 'ตัวอย่างรายงานการเบิกของ', sub: monthLabel(o.month) + ' · ' + list.length + ' รายการ · A4 แนวนอน',
        icon: 'file', wide: 'xl', cancelText: 'ปิด', okText: 'พิมพ์เลย',
        body: '<div class="docpreview">' + html + '</div>',
        onOk: () => { doPrint(html, { landscape: true }); return true; } });
    } else {
      const data = [[(S.org || {}).company_name || ''], ['รายงานการเบิกของประจำเดือน ' + monthLabel(o.month)],
        ['เลขที่', o.docNo], [o.cond], [], ISSUE_COLS]
        .concat(list.map((r, i) => [i + 1, r.dateTxt, r.code, r.name, r.dept, r.qty, r.unit, r.reason, r.balance]))
        .concat([[], ['รวม', '', '', '', '', list.reduce((s, r) => s + r.qty, 0)], [],
          ['ผู้จัดทำ', '', 'ผู้ตรวจสอบ', '', 'ผู้อนุมัติ', '', 'ผู้รับของ'],
          ['(......................)', '', '(......................)', '', '(......................)', '', '(......................)']]);
      exportXlsx([{ name: 'รายงานการเบิก', data }], 'issue_report_' + o.month + '.xlsx');
    }
  });
  back.addEventListener('change', async e => {
    const k = e.target.dataset.ir;
    if (!k) return;
    if (k === 'month') { st.month = e.target.value; st.dept = ''; $('#irBody').innerHTML = '<div class="skel" style="height:60px"></div>'; await load(); }
    else st.dept = e.target.value;
    redraw();
  });
}

/* ---------------------------------------------- ใบขอซื้อ (Purchase Request) */
function buildPRDoc(items, opt) {
