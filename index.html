/* ------------------------------------------- QR Code สำหรับให้ทีมงานสแกน */
function makeQRCanvas(text, targetPx) {
  const qr = qrcode(0, 'M');          // ระดับแก้ความผิดพลาด M เหมาะกับป้ายติดผนัง
  qr.addData(String(text));
  qr.make();
  const n = qr.getModuleCount(), margin = 4, total = n + margin * 2;
  const scale = Math.max(2, Math.floor((targetPx || 660) / total));
  const c = document.createElement('canvas');
  c.width = c.height = total * scale;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000000';
  for (let r = 0; r < n; r++) {
    for (let col = 0; col < n; col++) {
      if (qr.isDark(r, col)) g.fillRect((col + margin) * scale, (r + margin) * scale, scale, scale);
    }
  }
  return c;
}

        ['ลำดับ', 'รหัสสินค้า', 'รายการ', 'หน่วย', 'คงเหลือ', 'ค่า MAX', 'จำนวนที่ขอซื้อ', 'ลิงก์รูปภาพ']]
        .concat(items.map((it, i) => [i + 1, it.code, it.name, it.unit, it.qty,
          it.max_stock == null || it.max_stock === '' ? '' : toNum(it.max_stock), it.order_qty, it.image_url || '']))
        .concat([[], ['ผู้ขอเสนอ', '', 'ผู้ตรวจสอบ', '', 'ผู้อนุมัติ'], ['(............................)', '', '(............................)', '', '(............................)']]);
      exportXlsx([{ name: 'ใบขอซื้อ', data }], 'purchase_request_' + stamp() + '.xlsx');
    }
  });
  back.addEventListener('change', e => {
    if (e.target.hasAttribute && e.target.hasAttribute('data-prcat')) { st.cat = e.target.value; return redraw(); }
    const c = e.target.dataset.prc;
    if (c !== undefined) {
      const p = S.products.find(x => x.code === c);
      if (e.target.checked) sel[c] = suggestOrder(p) || 1; else delete sel[c];
      return redraw();
    }
    const q = e.target.dataset.prq;
    if (q !== undefined) {
      const v = toNum(e.target.value);
      if (v > 0) sel[q] = v; else delete sel[q];
      $('#prN').textContent = chosen().length;
    }
  });
  back.addEventListener('input', e => {
    if (e.target.id === 'prQ') { st.q = e.target.value; clearTimeout(back._d); back._d = setTimeout(redraw, 300); }
  });
  document.body.appendChild(back);
}

  const stt = statusOf(p);
  const cell = (t, v) => '<div><dt>' + t + '</dt><dd>' + v + '</dd></div>';
  modal({
    title: p.name, sub: 'รหัส ' + p.code + (p.category ? ' · ' + p.category : ''), icon: 'box', wide: true,
    cancelText: 'ปิด',
    body:
      '<div class="imgwrap" style="margin-bottom:14px">' +
        '<div>' +
          '<div class="imgbox" id="pdImgBox" style="width:128px;height:128px" title="คลิกเพื่อเพิ่ม/เปลี่ยนรูป">' +
            (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="">' : I.box + '<div>เพิ่มรูปสินค้า</div>') + '</div>' +
          '<input type="file" id="pdImgFile" accept="image/*" capture="environment" class="hide">' +
          '<div style="display:flex;gap:6px;margin-top:7px">' +
            '<button class="btn sm" id="pdImgPick" style="flex:1">' + (p.image_url ? 'เปลี่ยนรูป' : 'เพิ่มรูป') + '</button>' +
            (p.image_url ? '<button class="btn sm ghost" id="pdImgDel">ลบ</button>' : '') +
          '</div>' +
        '</div>' +
        '<div style="flex:1;min-width:220px">' +
          '<div class="bignum"><b style="color:var(--' + (stt === 'low' ? 'low' : stt === 'over' ? 'over' : 'text') + ')">' + num(p.qty) + '</b>' +
          '<span class="sub">' + esc(p.unit || 'หน่วย') + ' คงเหลือ</span><div class="spacer" style="flex:1"></div>' +
          '<span class="pill ' + stt + '">' + STATUS_TH[stt] + '</span></div>' +
          (statusOf(p) === 'low' ? '<div class="help" style="margin-top:8px">ควรสั่งเพิ่มอีกประมาณ <b>' + num(suggestOrder(p)) + ' ' + esc(p.unit || '') + '</b> เพื่อให้ถึงค่า MAX</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="detail-grid">' +
        cell('ตำแหน่งจัดเก็บ', esc([p.zone, p.shelf, p.bin].filter(Boolean).join(' / ') || '-')) +
        cell('จุดสั่งซื้อขั้นต่ำ', num(p.reorder_point)) +
        cell('ค่า MAX', p.max_stock == null || p.max_stock === '' ? '-' : num(p.max_stock)) +
        cell('ผู้ดูแล', esc(p.owner || '-')) +
        cell('อัปเดตล่าสุด', esc(fmtDT(p.updated_at) || '-')) +
      '</div>' +
      '<div style="display:flex;gap:9px;margin:16px 0">' +
        '<button class="btn primary" data-a="quick-in" data-code="' + esc(p.code) + '">' + I.down + 'รับเข้า</button>' +
        '<button class="btn" data-a="quick-out" data-code="' + esc(p.code) + '">' + I.up + 'เบิกออก</button>' +
        (isAdmin() ? '<button class="btn ghost" data-a="prod-edit" data-code="' + esc(p.code) + '">' + I.edit + 'แก้ไขข้อมูล</button>' : '') +
      '</div>' +
      '<div class="card-head" style="border:0;padding:0 0 8px"><h3>ความเคลื่อนไหวล่าสุด</h3></div>' +
      '<div id="pHist"><div class="skel" style="height:40px"></div></div>'
  });

  // ---- อัปโหลด/ลบรูปสินค้าได้จากหน้านี้เลย (ผู้ใช้ทุกคนที่เปิดสิทธิ์แล้วทำได้) ----
  const imgBox = $('#pdImgBox'), file = $('#pdImgFile');
  const applyImage = async (url) => {
    try {
      await S.db.setImage(p.code, url);
      p.image_url = url || null;
      const inList = S.products.find(x => String(x.code) === String(p.code));
      if (inList) inList.image_url = p.image_url;
      imgBox.innerHTML = url ? '<img src="' + esc(url) + '" alt="">' : I.box + '<div>เพิ่มรูปสินค้า</div>';
      $('#pdImgPick').textContent = url ? 'เปลี่ยนรูป' : 'เพิ่มรูป';
      toast(url ? 'บันทึกรูปสินค้าแล้ว' : 'ลบรูปสินค้าแล้ว');
      route();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
  if (imgBox && file) {
    const pick = e => { if (e) e.preventDefault(); file.click(); };
    imgBox.onclick = pick;
    $('#pdImgPick').onclick = pick;
    if ($('#pdImgDel')) $('#pdImgDel').onclick = async e => { e.preventDefault(); await applyImage(''); };
    file.onchange = async () => {
      if (!file.files.length) return;
      const f = file.files[0];
      file.value = '';
      try {
        toast('กำลังอัปโหลดรูป…');
        const blob = await shrinkImage(f);
        const url = await S.db.uploadImage(blob, p.code);
        await applyImage(url);
      } catch (e) { toast(errMsg(e), 'err'); }
    };
  }

  const list = await S.db.transactions({ q: p.code, limit: 12 });
  const box = $('#pHist'); if (!box) return;
  const mine = list.filter(t => String(t.code).toLowerCase() === String(p.code).toLowerCase());
  box.innerHTML = mine.length
    ? '<div class="table-wrap" style="max-height:230px;overflow-y:auto"><table class="data"><tbody>' +
      mine.map(t => '<tr><td style="width:1%"><span class="pill ' + t.type + '">' +
        (t.type === 'in' ? '+' : t.type === 'out' ? '−' : '±') + num(t.qty) + '</span></td>' +
        '<td>' + esc(TYPE_TH[t.type]) + (t.counterparty ? ' · ' + esc(t.counterparty) : '') +
        '<div class="sub">' + esc(t.actor_name) + ' · ' + fmtDT(t.created_at) + '</div></td>' +
        '<td class="r num sub">เหลือ ' + num(t.balance) + '</td></tr>').join('') + '</tbody></table></div>'
    : '<div class="empty" style="padding:20px">' + I.empty + '<div>ยังไม่มีความเคลื่อนไหว</div></div>';
}

async function quickMove(code, dir) {
  if (!S.products.length) S.products = await S.db.products();
  const p = S.products.find(x => String(x.code) === String(code));
  if (!p) return toast('ไม่พบสินค้า', 'err');
  const isIn = dir === 'in';
  await modal({
    title: (isIn ? 'รับเข้า' : 'เบิกออก') + ' — ' + p.name,
    sub: 'รหัส ' + p.code + ' · คงเหลือปัจจุบัน ' + num(p.qty) + ' ' + (p.unit || ''),
    icon: isIn ? 'in' : 'out', iconClass: isIn ? '' : 'warn',
    okText: isIn ? 'บันทึกรับเข้า' : 'ยืนยันการเบิก',
    body: '<div class="form-grid">' +
        '<div class="field"><label>จำนวน <span class="req">*</span></label>' +
          '<input id="qQty" type="number" min="0" step="any" placeholder="0"></div>' +
        '<div class="field"><label>' + (isIn ? 'ผู้ส่ง / ผู้จำหน่าย' : 'ผู้รับ / แผนกที่เบิก') + '</label>' +
          '<input id="qParty"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label>หมายเหตุ</label><input id="qNote"></div>' +
      (!isIn && statusOf(p) === 'low' ? '<div class="alert warn" style="margin:14px 0 0">ของชิ้นนี้ต่ำกว่าจุดสั่งซื้อแล้ว (' + num(p.qty) + '/' + num(p.reorder_point) + ')</div>' : ''),
    onOk: async () => {
      const qty = toNum($('#qQty').value);
      if (!(qty > 0)) { toast('จำนวนต้องมากกว่า 0', 'err'); return false; }
      const payload = { code: p.code, name: p.name, qty, counterparty: $('#qParty').value.trim(), note: $('#qNote').value.trim() };
      try {
        const r = isIn ? await S.db.stockIn(payload) : await S.db.stockOut(payload);
        toast((isIn ? 'รับเข้า ' : 'เบิกออก ') + p.name + ' แล้ว คงเหลือ ' + num(r.balance) +
              (!isIn && r.low_stock ? ' · ถึงจุดสั่งซื้อแล้ว' : ''), !isIn && r.low_stock ? 'warn' : '');
        $$('.modal-back').forEach(x => x.remove());   // ปิดหน้าต่างรายละเอียดที่ค้างอยู่ ไม่ให้เห็นตัวเลขเก่า
        route();
      } catch (e) { toast(errMsg(e), 'err'); return false; }
    }
  });
}

const A = {
  /* --- ตั้งค่า/เข้าสู่ระบบ --- */
  async 'cfg-save'() {
    const url = $('#cfgUrl').value.trim().replace(/\/+$/, ''), anonKey = $('#cfgKey').value.trim();
    if (!/^https?:\/\/.+/.test(url) || !anonKey) return authErr('กรุณากรอก URL และ anon key ให้ถูกต้อง');
    saveCfg({ url, anonKey }); location.reload();
  },
  async demo() { sessionStorage.setItem('demo', '1'); location.hash = ''; location.reload(); },
  'exit-demo'() { sessionStorage.removeItem('demo'); location.reload(); },
  async 'reset-cfg'() {
    if (await confirmBox('เปลี่ยนการเชื่อมต่อ', 'ระบบจะลืมค่า URL และ key ของโปรเจกต์นี้ แล้วกลับไปหน้าตั้งค่า', 'เปลี่ยน')) {
      localStorage.removeItem(CFG_KEY); location.reload();
    }
  },
  'go-login'() { renderAuth('login'); },
  async login(el) {
    authErr(''); el.disabled = true;
    try { await S.db.signIn($('#liUser').value.trim(), $('#liPw').value); await boot(); }
    catch (e) { authErr(errMsg(e)); el.disabled = false; }
  },
  async 'setup-admin'(el) {
    authErr('');
    const p = { username: $('#stUser').value.trim(), password: $('#stPw').value,
                full_name: $('#stName').value.trim(), position: $('#stPos').value.trim() };
    if (!USERNAME_RE.test(p.username)) return authErr('ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษ ตัวเลข . _ - ความยาว 3-32 ตัวอักษร');
    if (p.password.length < 6) return authErr('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
    if (!p.full_name) return authErr('กรุณากรอกชื่อ-สกุล');
    el.disabled = true;
    try {
      await S.db._signUpDetached(p);           // คนแรกของระบบ trigger จะตั้งให้เป็น admin + ใช้งานได้ทันที
      await S.db.signIn(p.username, p.password);
      await boot();
    } catch (e) { authErr(errMsg(e)); el.disabled = false; }
  },
  async logout() {
    stopIdleWatch();
    try { await S.db.signOut(); } catch (e) { }
    try { sessionStorage.removeItem('demo'); } catch (e) { }
    clearStaleAuth();
    location.hash = '';
    location.reload();
  },

  /* --- ทั่วไป --- */
  go(el) { if (el.dataset.f === 'low') V.products.f = { q: '', cat: '', st: 'low' }; location.hash = '#/' + el.dataset.k; },
  'go-cat'(el) {
    const c = el.dataset.c === '(ไม่ระบุหมวด)' ? '' : el.dataset.c;
    V.products.f = { q: '', cat: c, st: '' };
    location.hash = '#/products';
  },
  reload() { route(); },
  theme() { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); paintTheme(); if (S.route === 'settings') route(); },
  menu() {
    const sb = $('#sidebar'); sb.classList.toggle('open');
    if (sb.classList.contains('open')) {

async function productForm(p) {
  const f = (id, label, val, type, extra) =>
    '<div class="field"><label>' + label + '</label><input id="' + id + '" ' + (type ? 'type="' + type + '" step="any" min="0"' : '') +
    ' value="' + esc(val == null ? '' : val) + '" ' + (extra || '') + '></div>';
  let img = { url: (p && p.image_url) || '', blob: null, removed: false };

  const pr = modal({
    title: p ? 'แก้ไขสินค้า ' + p.code : 'เพิ่มสินค้าใหม่', icon: 'box', okText: 'บันทึก', wide: 'xl',
    sub: p ? '' : 'ระบบรันรหัสสินค้าให้อัตโนมัติ แก้เองได้',
    body: '<div class="imgwrap">' +
        '<div>' +
          '<div class="imgbox" id="fImgBox">' + (img.url ? '<img src="' + esc(img.url) + '" alt="">' : I.box + '<div>เพิ่มรูปสินค้า</div>') + '</div>' +
          '<input type="file" id="fImgFile" accept="image/*" class="hide">' +
          '<div style="display:flex;gap:6px;margin-top:8px">' +
            '<button class="btn sm" id="fImgPick">เลือกรูป</button>' +
            '<button class="btn sm ghost" id="fImgDel">ลบรูป</button>' +
          '</div>' +
        '</div>' +
        '<div style="flex:1;min-width:280px">' +
          '<div class="form-grid">' +
            '<div class="field"><label>รหัสสินค้า <span class="req">*</span></label>' +
              '<div style="display:flex;gap:6px"><input id="fCode" value="' + esc((p && p.code) || '') + '" style="flex:1">' +
              (p ? '' : '<button class="btn sm" id="fCodeGen" title="รันเลขใหม่">↻</button>') + '</div></div>' +
            f('fName', 'ชื่อสินค้า <span class="req">*</span>', p && p.name) +
            f('fCat', 'หมวดหมู่', p && p.category) +
            f('fUnit', 'หน่วยนับ', p && p.unit) +
            f('fZone', 'โซน', p && p.zone) + f('fShelf', 'ชั้น', p && p.shelf) + f('fBin', 'ช่อง', p && p.bin) +
            f('fRp', 'จุดสั่งซื้อขั้นต่ำ', p && p.reorder_point, 'number') +
            f('fMax', 'ค่า MAX', p && p.max_stock, 'number') +
            f('fOwner', 'ผู้ดูแลที่รับผิดชอบ', p && p.owner) +
            (p ? '' : f('fQty', 'จำนวนตั้งต้น', 0, 'number')) +
          '</div>' +
        '</div>' +
      '</div>' +
      (p ? '<div class="help" style="margin-top:12px">การแก้ไขที่นี่ไม่เปลี่ยนยอดคงเหลือ — ใช้เมนูรับเข้า/เบิกออกหรือปรับยอดแทน</div>' : ''),
    onOk: async () => {
      const data = {
        id: p && p.id, code: $('#fCode').value.trim(), name: $('#fName').value.trim(),
        category: $('#fCat').value.trim(), unit: $('#fUnit').value.trim(), zone: $('#fZone').value.trim(),
        shelf: $('#fShelf').value.trim(), bin: $('#fBin').value.trim(), owner: $('#fOwner').value.trim(),
        reorder_point: toNum($('#fRp').value), max_stock: $('#fMax').value === '' ? '' : toNum($('#fMax').value),
        qty: p ? undefined : toNum(($('#fQty') || {}).value)
      };
      if (!data.code || !data.name) { toast('กรุณากรอกรหัสและชื่อสินค้า', 'err'); return false; }
      try {
        if (img.blob) { toast('กำลังอัปโหลดรูป…'); data.image_url = await S.db.uploadImage(img.blob, data.code); }
        else if (img.removed) data.image_url = null;
        else if (p) data.image_url = p.image_url || null;
        await S.db.saveProduct(data);
        toast('บันทึกสินค้าแล้ว'); route();
      } catch (e) { toast(errMsg(e), 'err'); return false; }
    }
  });

  // ผูกปุ่มรูปและปุ่มรันเลข (ทำหลัง modal ถูกวางลง DOM แล้ว)
  const box = $('#fImgBox'), file = $('#fImgFile');
  const pick = () => file.click();
  box.onclick = pick;
  $('#fImgPick').onclick = e => { e.preventDefault(); pick(); };
  $('#fImgDel').onclick = e => {
    e.preventDefault();
    img = { url: '', blob: null, removed: true };
    box.innerHTML = I.box + '<div>เพิ่มรูปสินค้า</div>';
  };
  file.onchange = async () => {
    if (!file.files.length) return;
    try {
      const blob = await shrinkImage(file.files[0]);
      img = { url: await blobToDataUrl(blob), blob, removed: false };
      box.innerHTML = '<img src="' + img.url + '" alt="">';
    } catch (e) { toast(errMsg(e), 'err'); }
    file.value = '';
  };
  if (!p) {
    const gen = async () => {
      try { $('#fCode').value = await S.db.nextCode(); } catch (e) { /* ปล่อยให้กรอกเอง */ }
    };
    $('#fCodeGen').onclick = e => { e.preventDefault(); gen(); };
    gen();
  }
  await pr;
}

/* ------------------------------------------------------- ตัวรับเหตุการณ์ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  e.preventDefault();
  try { await A[el.dataset.a](el, e); }
  catch (err) { toast(errMsg(err), 'err'); }
});
let deb;
document.addEventListener('input', e => {
  const a = e.target.dataset.a2;
  if (!a) return;
  if (a === 'in-code') { fillFromCode('i'); return; }
  if (a === 'out-code') { fillFromCode('o'); return; }
  clearTimeout(deb);
  deb = setTimeout(() => {
    if (a === 'pfilter') { V.products.f = { q: $('#pq').value, cat: $('#pcat').value, st: V.products.f.st }; route(); }
    if (a === 'hfilter') { V.history.f = { ...V.history.f, q: $('#hq').value, from: $('#hfrom').value, to: $('#hto').value }; route(); }
  }, 380);
});
// ตัวเลือกภายในหน้าต่างนำเข้าไฟล์
document.addEventListener('change', e => {
  const a = e.target.dataset.a3;
  if (!a || !S.imp) return;
  if (a === 'sheet') { S.imp.sheet = e.target.value; analyzeSheet(); }
  else if (a === 'hrow') { S.imp.headerRow = Number(e.target.value); automap(); }
  else if (a === 'map') {
    const k = e.target.dataset.k, v = e.target.value;
    if (v === '') delete S.imp.map[k]; else S.imp.map[k] = Number(v);
  }
  renderWizard();
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'file' || !e.target.files.length) return;
  const file = e.target.files[0];
  try { await openImportWizard(file); }
  catch (err) { toast('อ่านไฟล์ไม่สำเร็จ: ' + errMsg(err), 'err'); }
  e.target.value = '';
});
document.addEventListener('dragover', e => { const dz = e.target.closest('#dz'); if (dz) { e.preventDefault(); dz.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const dz = e.target.closest('#dz'); if (dz) dz.classList.remove('drag'); });
document.addEventListener('drop', async e => {
  const dz = e.target.closest('#dz'); if (!dz) return;
  e.preventDefault(); dz.classList.remove('drag');
  const file = e.dataTransfer.files[0]; if (!file) return;
  try { await openImportWizard(file); }
  catch (err) { toast('อ่านไฟล์ไม่สำเร็จ: ' + errMsg(err), 'err'); }
});
window.addEventListener('hashchange', () => { if (S.me) route(); });

/* ------------------------------------------------------------- เริ่มระบบ */
async function boot() {
  try {
    clearStaleAuth();
    stopIdleWatch();
    let isDemo = false;
    try { isDemo = sessionStorage.getItem('demo') === '1'; } catch (e) { }
    if (isDemo) S.db = makeDemoDB();
    else {
      const cfg = loadCfg();
      if (!cfg) return renderSetup();
      if (!window.supabase) return renderSetup();
      S.db = makeSupabaseDB(cfg);
    }
    const sess = await S.db.session();
    if (!sess) {
      let needs = false;
      try { needs = await S.db.needsSetup(); } catch (e) { needs = false; }
      return renderAuth(needs ? 'setup' : 'login');
    }
    S.session = sess;
    S.me = await S.db.me();
    if (!S.me) { await S.db.signOut(); return renderAuth('login'); }
    if (S.me.status !== 'active') return renderPending();

    S.stats = await S.db.stats();
    try { S.org = await S.db.settings(); } catch (e) { S.org = {}; }
    applyOrg();
    renderApp();
    await route();
    startIdleWatch();
    if (S.unsub) S.unsub();
    S.unsub = S.db.subscribe(async what => {
      if (String(what).startsWith('status:')) return paintLive(what === 'status:SUBSCRIBED');
      if (['dashboard', 'products', 'in', 'out', 'history'].includes(S.route)) route();
      S.stats = await S.db.stats(); paintNav();
    });
  } catch (e) {
    $('#root').innerHTML = authFrame('<div class="t">เชื่อมต่อไม่สำเร็จ</div>' +
      '<div class="alert err">' + esc(errMsg(e)) + '</div>' +
      '<button class="btn block" data-a="reset-cfg">แก้ไขการเชื่อมต่อ</button>' +
      '<div class="auth-alt"><button data-a="demo">เปิดโหมดสาธิต</button></div>');
  }
}
boot();

</script>
